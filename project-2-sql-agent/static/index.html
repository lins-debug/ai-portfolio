<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL 数据分析 Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; max-width: 960px; margin: 40px auto; padding: 0 20px; color: #1a1a1a; }
  h1 { font-size: 22px; margin-bottom: 24px; }
  .search-box { display: flex; gap: 8px; margin-bottom: 24px; }
  .search-box input { flex: 1; padding: 10px 14px; border: 1px solid #d0d0d0; border-radius: 6px; font-size: 15px; }
  .search-box button { padding: 10px 20px; background: #1a1a1a; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
  .search-box button:hover { background: #333; }
  .hint { font-size: 13px; color: #999; margin-bottom: 20px; }
  .sql-box { background: #f5f5f5; padding: 12px 16px; border-radius: 6px; font-family: 'Consolas', monospace; font-size: 13px; margin-bottom: 16px; overflow-x: auto; }
  .error { color: #d32f2f; background: #fff0f0; padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #e5e5e5; font-size: 14px; }
  th { font-weight: 600; color: #666; border-bottom: 2px solid #ccc; }
  .loading { color: #999; font-size: 14px; }
</style>
</head>
<body>
<h1>SQL 数据分析 Agent</h1>
<div class="hint">提示：查询各部门人数、各品类销售额、员工薪资排名、客户订单统计等</div>
<div class="search-box">
  <input id="question" type="text" placeholder="用自然语言提问，例如：每个部门的平均薪资是多少？" autofocus>
  <button id="queryBtn">查询</button>
</div>
<div id="result"></div>

<script>
const input = document.getElementById("question");
const btn = document.getElementById("queryBtn");
const result = document.getElementById("result");

async function query() {
  const q = input.value.trim();
  if (!q) return;
  result.innerHTML = '<p class="loading">查询中...</p>';
  try {
    const res = await fetch("/query", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q }),
    });
    const data = await res.json();
    let html = "";
    if (data.error) {
      html += '<div class="error">' + data.error + "</div>";
    }
    html += '<div class="sql-box">' + data.sql + "</div>";
    if (data.columns.length > 0) {
      html += "<table><thead><tr>";
      for (const col of data.columns) {
        html += "<th>" + col + "</th>";
      }
      html += "</tr></thead><tbody>";
      for (const row of data.rows) {
        html += "<tr>";
        for (const cell of row) {
          html += "<td>" + (cell != null ? cell : "") + "</td>";
        }
        html += "</tr>";
      }
      html += "</tbody></table>";
    }
    result.innerHTML = html;
  } catch (e) {
    result.innerHTML = '<div class="error">请求失败：' + e.message + "</div>";
  }
}

btn.addEventListener("click", query);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") query(); });
</script>
</body>
</html>
